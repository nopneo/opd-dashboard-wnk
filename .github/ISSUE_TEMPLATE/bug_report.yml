name: แจ้งปัญหา
description: หน้าจอทำงานผิด ตัวเลขผิด หรือติดตั้งไม่ได้ (หลังรัน setup_check.py แล้ว)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **ก่อนแจ้ง** — รัน `python setup_check.py` (Docker: `docker compose exec opd python setup_check.py`) แล้วแก้ข้อ ✘ ก่อน
        ปัญหาติดตั้งส่วนใหญ่มาจากสภาพแวดล้อมของเครื่อง (Python, firewall, สิทธิ์ฐานข้อมูล, เขตเวลา)
        ตัวเลขดูผิด → เปิดหน้า `/check` ดู Data Audit ก่อน (รหัสแผนก/รหัสนัดของแต่ละ รพ. ไม่เหมือนกัน)

        ⚠ **ห้ามแนบข้อมูลผู้ป่วย** (HN ชื่อ เลขบัตร) หรือรหัสผ่าน / ค่าใน `.env` — ปิดบังในภาพหน้าจอก่อนแนบ
  - type: dropdown
    id: kind
    attributes:
      label: ประเภทปัญหา
      options:
        - ติดตั้ง / เปิดแอปไม่ได้
        - หน้าจอทำงานผิด (ปุ่ม กราฟ ผังผู้ป่วย)
        - ตัวเลขไม่ตรงกับรายงานของโรงพยาบาล
        - ปุ่มส่งออก PNG / JPG / PDF
        - อื่น ๆ
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: เวอร์ชัน
      description: ดูท้ายหน้าแดชบอร์ด เช่น 1.4.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: ติดตั้งแบบไหน
      options:
        - Linux (systemd / gunicorn)
        - Windows
        - Docker / docker compose
        - Add-on บน BMS Marketplace
    validations:
      required: true
  - type: textarea
    id: setup_check
    attributes:
      label: ผลของ setup_check.py
      description: คัดลอกผลทั้งหมดมาวาง (ไม่มีข้อมูลผู้ป่วยหรือรหัสผ่านในผลนี้) · Add-on ใส่ “ไม่มี”
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: เกิดอะไรขึ้น และควรเป็นอย่างไร
      description: ทำอะไร ช่วงวันที่ไหน หน้าไหน เห็นอะไร · ตัวเลขผิด → บล็อกไหน ตัวเลขเท่าไร รายงานเดิมได้เท่าไร
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: ข้อความ error / log (ถ้ามี)
      description: Linux `journalctl -u <ชื่อ service> -n 50` · Docker `docker compose logs --tail 50 opd`
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: ยืนยัน
      options:
        - label: ไม่มีข้อมูลผู้ป่วยหรือรหัสผ่านในสิ่งที่แนบมา
          required: true
