# OPD Dashboard ด้วย Docker Compose — ติดตั้งในโรงพยาบาล ต่อฐานข้อมูล HOSxP ตรง (ดู INSTALL_DOCKER.md)
#   cp .env.example .env   แล้วแก้ค่าฐานข้อมูล
#   docker compose up -d --build
#   เปิด http://<เครื่องนี้>:5900/
services:
  opd:
    build:
      context: .
      target: direct          # ต่อฐานข้อมูลตรง + ปุ่มส่งออก PNG/JPG/PDF
    image: opd-dashboard-direct
    container_name: opd-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"            # พอร์ตใน container (ทับค่า PORT ใน .env) — พอร์ตที่เปิดให้ผู้ใช้กำหนดที่ ports
      # sandbox ของ chromium ใช้ใน container ทั่วไปไม่ได้ (ปุ่มส่งออกล้ม SIGABRT) — container เป็นตัวกั้นแทน
      OPD_CHROME_NO_SANDBOX: "1"
    ports:
      - "5900:8080"
    # ฐานข้อมูล HOSxP อยู่เครื่องเดียวกับ Docker: ใช้ DB_HOST=host.docker.internal ใน .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ไฟล์ของโรงพยาบาลเอง (ไม่บังคับ) — เอา # ออกเมื่อมีไฟล์แล้ว
    # volumes:
    #   - ./flow_layout.json:/app/flow_layout.json:ro
    #   - ./hospital_logo.png:/app/static/img/hospital_logo.png:ro
