{#- ไอคอนแอปเวลา "เพิ่มลงหน้าจอโฮม" — Android/Chrome อ่าน manifest, iOS/Safari อ่าน apple-touch-icon
    ?v= เปลี่ยนเมื่อเปลี่ยนโลโก้ ไม่งั้นเบราว์เซอร์ใช้ไอคอนเก่าจากแคช -#}
<link rel="manifest" href="{{ url_for('manifest') }}?v={{ icon_v }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icon/apple-touch-icon.png') }}?v={{ icon_v }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icon/favicon-32.png') }}?v={{ icon_v }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon/icon-192.png') }}?v={{ icon_v }}">
<meta name="theme-color" content="#0f2a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPD Dashboard">
